<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <title>Recuperar contraseña</title>
</head>

<body>
    <header class="navegacion">
        <nav class="contenedor-nav">
            <a href="../index.html" class="logo-marca">
                <img src="../img/logo-lingo.svg" alt="Lingo Panda" class="img-logo">
                <span class="nombre-brand">LingoPanda</span>
            </a>
            <span class="descripcion-brand">Aprende Inglés, Alemán y Chino gratis y de forma divertida</span>
        </nav>
    </header>
    <main>
        <form class="recuperar-form" action="./correo_enviado.html">
            <p>Ingresá tu usuario o email para que podamos enviarte instrucciones para recuperar tu cuenta</p>
            <section class="recuperar-input_container">
                <label for="usuario">Usuario / Email</label>
                <input type="text" name="usuario" id="usuario">
            </section>
            <button class="recuperar-boton_iniciar" type="submit">Enviar solicitud</button>
            <a href="../login/index.html" class="recuperar-link">¿Recordaste tu contraseña? Inicia sesión aquí</a>
        </form>
    </main>
</body>
</html>

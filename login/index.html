<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <title>Iniciar sesión</title>
</head>

<body>
    <header class="header">
        <h1 class="titulo"><a href="/index.html"> 🌎LingoWeb🌍</a></h1>
        <p class="subtitulo">Aprende Inglés, Alemán y Chino gratis y de forma divertida</p>
    </header>
    <main>
        <!-- se usa GET. Metodo no permitido 405 -->
        <form class="login-form" action="../dashboard/index.html">
            <section class="login-input_container">
                <label for="usuario">Usuario / Email</label>
                <input type="text" name="usuario" id="usuario" required>
                <label for="contrasenia">Contraseña</label>
                <input type="password" name="contrasenia" id="contrasenia" required>
            </section>
            <button class="login-boton_iniciar" type="submit">Iniciar sesión</button>
            <section class="login-links">
                <a href="../recuperar_contrasenia/index.html">¿Olvidaste tu contraseña?</a><span>|</span><a
                    href="../registrar/index.html">¿No tienes cuenta? Créala aquí</a>
            </section>
        </form>
    </main>
</body>

</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="160" height="176">
  <!-- Sombra base estilo Duolingo -->
  <ellipse cx="100" cy="195" rx="60" ry="15" fill="#3c3c3c" opacity="0.2" />

  <!-- Patitas / Base inferior -->
  <path d="M 65 180 Q 75 200 85 180 Z" fill="#e06300" />
  <path d="M 115 180 Q 125 200 135 180 Z" fill="#e06300" />

  <!-- Cuerpo principal redondeado (Color Naranja Principal) -->
  <rect x="40" y="40" width="120" height="140" rx="60" ry="60" fill="#ff7a00" />

  <!-- Oreja Izquierda -->
  <circle cx="45" cy="45" r="22" fill="#3c3c3c" />
  <circle cx="45" cy="45" r="12" fill="#e06300" />

  <!-- Oreja Derecha -->
  <circle cx="155" cy="45" r="22" fill="#3c3c3c" />
  <circle cx="155" cy="45" r="12" fill="#e06300" />

  <!-- Parches oscuros de los ojos (Característico del Panda) -->
  <ellipse cx="70" cy="100" rx="26" ry="30" fill="#3c3c3c" transform="rotate(-10 70 100)" />
  <ellipse cx="130" cy="100" rx="26" ry="30" fill="#3c3c3c" transform="rotate(10 130 100)" />

  <!-- Ojos Blancos Expressivos -->
  <ellipse cx="73" cy="98" rx="16" ry="20" fill="#ffffff" />
  <ellipse cx="127" cy="98" rx="16" ry="20" fill="#ffffff" />

  <!-- Pupilas Negras -->
  <ellipse cx="76" cy="98" rx="9" ry="12" fill="#222222" />
  <ellipse cx="124" cy="98" rx="9" ry="12" fill="#222222" />

  <!-- Brillos de las pupilas (Efecto tierno) -->
  <circle cx="78" cy="93" r="4" fill="#ffffff" />
  <circle cx="126" cy="93" r="4" fill="#ffffff" />

  <!-- Hocico Blanco Central -->
  <ellipse cx="100" cy="130" rx="22" ry="16" fill="#ffffff" />

  <!-- Nariz Naranja Oscuro -->
  <path d="M 92 122 Q 100 118 108 122 Q 100 132 92 122 Z" fill="#e06300" />

  <!-- Boca sonriente -->
  <path d="M 94 133 Q 100 139 106 133" stroke="#3c3c3c" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Cejas de entusiasmo -->
  <path d="M 55 65 Q 70 55 80 68" stroke="#ffb800" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M 145 65 Q 130 55 120 68" stroke="#ffb800" stroke-width="5" stroke-linecap="round" fill="none" />
</svg>

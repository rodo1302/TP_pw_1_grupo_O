<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../global.css">
  <link rel="stylesheet" href="leccion-interactiva.css">

  <title>Grupo O</title>
</head>

<body>
  <header class="encabezado">
    <a href="/dashboard/dashboard.html" class="logo-marca">
      <img src="../img/logo-lingo.svg" alt="Lingo Panda" class="img-logo">
      <span class="nombre-brand">LingoPanda</span>
    </a>
    <nav class="contenedor-nav">
      <div class="progreso-bar">
        <a href="../dashboard/dashboard.html" class="btn btn-rojo btn-salir">X</a>
        <label for="progreso"><strong>Progreso: </strong></label>
        <progress id="progreso" max="100" value="0">0%</progress>
        <span><strong>0%</strong></span>
      </div>
    </nav>

    <aside class="indicadores-header">
      <p class="stat-item racha">❤️❤️❤️ <strong> Vidas: 3</strong></p>
    </aside>
  </header>
  <main class="contenedor-principal">
    <section class="leccion">
      <article class="leccion-oracion">
        <h3>Traduce la oración:</h3>
        <p>"我想喝茶 - Wǒ xiǎng hē chá"</p>
      </article>
      <article class="leccion-respuesta">
        <h3>Arma la oracion:</h3>

        <input type="checkbox" id="p-yo" class="chk-p chk-correcta">
        <label for="p-yo" class="btn btn-chk">Yo</label>

        <input type="checkbox" id="p-quiero" class="chk-p chk-correcta">
        <label for="p-quiero" class="btn btn-chk">quiero</label>

        <input type="checkbox" id="p-tomar" class="chk-p chk-correcta">
        <label for="p-tomar" class="btn btn-chk">tomar</label>

        <input type="checkbox" id="p-te" class="chk-p chk-correcta">
        <label for="p-te" class="btn btn-chk">té</label>

        <input type="checkbox" id="p-comer" class="chk-p">
        <label for="p-comer" class="btn btn-chk">comer</label>

        <input type="checkbox" id="p-puedo" class="chk-p">
        <label for="p-puedo" class="btn btn-chk">puedo</label>

        <input type="checkbox" id="p-agua" class="chk-p">
        <label for="p-agua" class="btn btn-chk">agua</label>

        <input type="checkbox" id="p-el" class="chk-p">
        <label for="p-el" class="btn btn-chk">Él</label>

    </section>

    <dialog id="modal-respuesta" class="modal-dialog">
      <div class="msj-respuesta">
        <p>Respuesta incorrecta. Vuelve a intentarlo.</p>
        <button commandfor="modal-respuesta" command="close" class="btn">Intentar de nuevo</button>
      </div>
    </dialog>

    <!-- <dialog id="modal-respuesta" class="modal-dialog">
      <div class="msj-respuesta">
        <h3>¡Excelente!</h3>
        <p>Traducción correcta.</p>
        <button commandfor="modal-respuesta" command="close" class="btn btn-exito-accion">
          Continuar
        </button>
      </div>
    </dialog> -->


    <section class="barra-inferior">
      <button commandfor="modal-respuesta" command="show-modal" class="btn btn-verde">
        Comprobar Respuesta
      </button>
    </section>

  </main>
</body>

</html>

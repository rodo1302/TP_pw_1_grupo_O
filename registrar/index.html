<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
    <title>Registrar usuario</title>
</head>

<body>
    <header class="navegacion">
        <nav class="contenedor-nav">
            <a href="../index.html" class="logo-marca">
                <img src="../img/logo-lingo.svg" alt="Lingo Panda" class="img-logo">
                <span class="nombre-brand">LingoPanda</span>
            </a>
            <span class="descripcion-brand">Aprende Inglés, Alemán y Chino gratis y de forma divertida</span>
        </nav>
    </header>
    <main>
        <!-- se cambia a GET. Metodo no permitido 405 -->
        <form class="registrar-form" action="./usuario_registrado.html">
            <section class="registrar-input_container">
                <label for="usuario">Usuario</label>
                <input type="text" name="usuario" id="usuario" required>
                <label for="email">Email</label>
                <input type="email" name="email" id="email">
                <label for="contrasenia">Contraseña</label>
                <input type="password" name="contrasenia" id="contrasenia" required>
            </section>
            <button class="registrar-boton_iniciar" type="submit">Registrar usuario</button>
            <a href="../login/index.html" class="registrar-link">¿Tienes cuenta? Inicia sesión aquí</a>
        </form>
    </main>
    <footer class="footer">
        <small>&copy; 2026 LingoPanda. Todos los derechos reservados.</small>
    </footer>
</body>

</html>
